<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Крестики-Нолики API</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
<div class="app">

  <header>
    <h1>✕ КРЕСТИКИ-НОЛИКИ ○</h1>
    <p>// API INTERFACE v2.0 — SCHOOL 21</p>
  </header>

  <div class="layout">


    <div class="left-col">


      <div class="panel">
        <div class="panel-title">// АВТОРИЗАЦИЯ</div>
        <div class="tabs">
          <button class="tab active" onclick="switchTab(this,'login-tab')">ВХОД</button>
          <button class="tab" onclick="switchTab(this,'register-tab')">РЕГИСТРАЦИЯ</button>
        </div>

        <div id="login-tab" class="tab-content active">
          <div id="auth-status" class="auth-status logged-out">○ НЕ АВТОРИЗОВАН</div>
          <div class="field">
            <label>ЛОГИН</label>
            <input id="login-input" type="text" placeholder="vasya" value="vasya">
          </div>
          <div class="field">
            <label>ПАРОЛЬ</label>
            <input id="password-input" type="password" placeholder="12345" value="12345">
          </div>
          <button class="btn btn-primary" onclick="doLogin()">→ ВОЙТИ</button>
          <button class="btn btn-ghost" onclick="doLogout()">✕ ВЫЙТИ</button>
          <div id="user-uuid-box" class="uuid-box hidden">
            <span>USER UUID:</span><br>
            <span id="user-uuid-val"></span>
          </div>
        </div>

        <div id="register-tab" class="tab-content">
          <div class="field">
            <label>ЛОГИН</label>
            <input id="reg-login" type="text" placeholder="petya">
          </div>
          <div class="field">
            <label>ПАРОЛЬ</label>
            <input id="reg-password" type="password" placeholder="54321">
          </div>
          <button class="btn btn-info" onclick="doRegister()">+ ЗАРЕГИСТРИРОВАТЬСЯ</button>
        </div>
      </div>


      <div class="panel">
        <div class="panel-title">// НОВАЯ ИГРА</div>
        <div class="panel-body">
          <div class="field">
            <label>СОПЕРНИК</label>
            <select id="opponent-type">
              <option value="computer">КОМПЬЮТЕР</option>
              <option value="user">ИГРОК</option>
            </select>
          </div>
          <button class="btn btn-primary" onclick="createGame()">→ СОЗДАТЬ ИГРУ</button>
        </div>
      </div>


      <div class="panel">
        <div class="panel-title">// ДОСТУПНЫЕ ИГРЫ</div>
        <div class="panel-body">
          <button class="btn btn-ghost" onclick="loadGames()">↺ ОБНОВИТЬ</button>
          <div id="games-list" class="games-list">
            <div class="empty-msg">Нажми ОБНОВИТЬ</div>
          </div>
        </div>
      </div>


      <div class="panel">
        <div class="panel-title">// ПОИСК ПОЛЬЗОВАТЕЛЯ</div>
        <div class="panel-body">
          <div class="field">
            <label>UUID ПОЛЬЗОВАТЕЛЯ</label>
            <input id="search-uuid" type="text" placeholder="a785e6e4-...">
          </div>
          <button class="btn btn-info" onclick="getUser()">→ НАЙТИ</button>
          <div id="user-info" class="hidden">
            <div class="info-row"><span class="key">ID</span><span id="ui-id"></span></div>
            <div class="info-row"><span class="key">LOGIN</span><span id="ui-login"></span></div>
          </div>
        </div>
      </div>

    </div>


    <div class="right-col">


      <div class="panel">
        <div class="panel-title">// ИГРОВОЕ ПОЛЕ</div>
        <div class="panel-body">

          <div class="board-container">
            <div id="game-status" class="game-status gs-idle">ИГРА НЕ НАЧАТА</div>
            <div id="my-symbol" class="my-symbol-box hidden"></div>
            <div class="board" id="board"></div>
            <div id="game-id-box" class="uuid-box hidden">
              <span>GAME UUID:</span><br>
              <span id="game-uuid-val"></span>
            </div>
            <div class="poll-indicator hidden" id="poll-indicator">
              <div class="poll-dot" id="poll-dot"></div>
              <span id="poll-label">АВТООБНОВЛЕНИЕ КАЖДЫЕ 2 СЕК</span>
            </div>
          </div>

          <hr class="divider">


          <div class="move-grid">
            <div class="field">
              <label>СТРОКА (0-2)</label>
              <input id="move-row" type="number" min="0" max="2" value="0">
            </div>
            <div class="field">
              <label>СТОЛБЕЦ (0-2)</label>
              <input id="move-col" type="number" min="0" max="2" value="0">
            </div>
            <button class="btn btn-primary" onclick="makeMove()">ХОД</button>
          </div>


          <div class="control-grid">
            <button class="btn btn-ghost" onclick="refreshGame()">↺ ОБНОВИТЬ</button>
            <button class="btn btn-danger" onclick="clearGame()">✕ СБРОСИТЬ</button>
          </div>

        </div>
      </div>


      <div class="panel">
        <div class="panel-title">// ЛОГ ЗАПРОСОВ</div>
        <div class="panel-body">
          <div id="log" class="log">
            <div class="log-entry dim">// Ожидание действий...</div>
          </div>
          <button class="btn btn-ghost btn-sm" onclick="clearLog()">ОЧИСТИТЬ ЛОГ</button>
        </div>
      </div>

    </div>

  </div>
</div>

<script src="/assets/js/app.js"></script>
</body>
</html>
